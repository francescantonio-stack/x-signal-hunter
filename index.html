<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#000"><link rel=manifest href=manifest.json><title>X Signal Hunter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,Inter,sans-serif;padding:96px 12px 90px}
.mq{position:fixed;top:0;left:0;right:0;height:26px;background:#ffc400;color:#000;font:700 12px monospace;overflow:hidden;white-space:nowrap;z-index:9}
.mq span{display:inline-block;padding-left:100%;animation:m 25s linear infinite;line-height:26px}@keyframes m{to{transform:translateX(-100%)}}
header{position:fixed;top:26px;left:0;right:0;background:#000;display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:8;border-bottom:1px solid #1c1c1c}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ffc400,#ff6a00);display:grid;place-items:center;color:#000;font-weight:900}
h1{font-size:17px;margin:0;flex:1}.pill{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800}
.y{background:#ffc400;color:#000}.g{background:#1d1d1d;color:#aaa}.ok{background:#16351f;color:#4ade80}.rug{background:#3a1212;color:#f87171}.sh{background:#3a2a0a;color:#ff9f1a}
.rf{background:#1d1d1d;border:0;color:#ffc400;border-radius:10px;width:32px;height:32px;font-size:16px}
.upd{font-size:11px;color:#777;margin:0 0 10px}
.card{background:#141414;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid #1f1f1f}
.row{display:flex;align-items:center;gap:8px}.sym{font-weight:800;font-size:16px;flex:1}
.sc{font-size:26px;font-weight:900;color:#ffc400}.met{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.met div{background:#1c1c1c;border-radius:10px;padding:6px;text-align:center;font-size:10px;color:#888}.met b{display:block;color:#fff;font-size:14px}
.st{background:none;border:0;font-size:22px;color:#555}.st.on{color:#ffc400}a{color:#ff9f1a;font-size:12px;text-decoration:none}
nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#0b0b0b;border-top:1px solid #1f1f1f;display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:#777;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}nav button.a{color:#ffc400}nav i{font-style:normal;font-size:19px}
.plus{width:60px;height:60px;border-radius:50%;background:#ffc400;color:#000!important;font-size:30px!important;margin-top:-34px;box-shadow:0 0 22px #ffc40088;justify-content:center}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#ffc400;color:#000;padding:8px 16px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;transition:.3s}
label{display:block;font-size:12px;color:#aaa;margin:10px 0 2px}input[type=range]{width:100%;accent-color:#ffc400}h2{font-size:15px;color:#ffc400;margin:4px 0 10px}
</style></head><body>
<div class=mq><span id=mq></span></div>
<header><div class=logo>X</div><h1>X Signal Hunter</h1><span class="pill y">DEGEN</span><span class="pill g">DEV</span><button class=rf onclick=render()>↻</button></header>
<p class=upd id=upd></p><main id=v></main><div class=toast id=t></div>
<nav><button data-t=scan class=a><i>📡</i>Scanner</button><button data-t=watch><i>☆</i>Watchlist</button><button data-t=hunt class=plus>+</button><button data-t=trade><i>⇄</i>Trade</button><button data-t=dash><i>▦</i>Dashboard</button></nav>
<script>
const D={"tokens": [{"mint": "5e8GPzhqxLKFVU6gb87aJLZMoSQnbjBhQupXvCCZpump", "posts": 24, "unique_authors": 18, "credible_authors": 17, "new_accounts": 0, "mentions_15m": 5, "mentions_prev_15m": 1, "dup_ratio": 0.12, "new_ratio": 0.0, "score": 60.9, "veto": [], "x_pass": true, "saturated": true, "at": "2026-10-16T18:53:00+00:00", "sym": "SR", "liq": 78896.55, "h1": 16.01, "mc": 830834, "ok": true}, {"mint": "9g4Pib6AM3oVdP9YA7ZcssAXAuhoUzkjR8w27doYpump", "posts": 25, "unique_authors": 22, "credible_authors": 17, "new_accounts": 0, "mentions_15m": 7, "mentions_prev_15m": 6, "dup_ratio": 0.08, "new_ratio": 0.0, "score": 57.0, "veto": [], "x_pass": true, "saturated": true, "at": "2026-10-16T18:53:00+00:00", "sym": "Pepper", "liq": 102598.35, "h1": -5.34, "mc": 925641, "ok": true}, {"mint": "G3NKPRK3BVrNDPLCbtG53SibytphwDqiTrnaiUq9pump", "posts": 25, "unique_authors": 21, "credible_authors": 20, "new_accounts": 0, "mentions_15m": 12, "mentions_prev_15m": 8, "dup_ratio": 0.08, "new_ratio": 0.0, "score": 71.0, "veto": [], "x_pass": true, "saturated": true, "at": "2026-10-16T18:53:00+00:00", "sym": "ROADSTER", "liq": 223976.48, "h1": 69.98, "mc": 6124216, "ok": true}], "cfg": {"live_mode": false, "live_mode_confirm": "", "_live_note": "live richiede live_mode=true E live_mode_confirm='I_ACCEPT_REAL_FUNDS_RISK' impostati a mano da Max", "x_budget": {"max_results_per_call": 25, "calls_per_min": 30, "calls_per_day": 1000}, "credible": {"min_account_age_days": 90, "min_followers": 200}, "score": {"w_unique": 1, "w_credible": 2, "w_velocity": 3, "pen_dup": 25, "pen_new": 20, "min_score_entry": 40}, "veto": {"max_dup_ratio": 0.6, "max_new_account_ratio": 0.6, "velocity_spike_low_credible": 10}, "sizing": {"entry_usd": 1.0, "reentries_usd": [1.0, 0.5], "max_reentries": 2}, "paper_variants": [{"id": "A_dip_big_first", "trigger": "dip", "dip_pct": -25, "order": [1.0, 0.5]}, {"id": "B_dip_small_first", "trigger": "dip", "dip_pct": -25, "order": [0.5, 1.0]}, {"id": "C_confirm_big_first", "trigger": "confirm", "confirm": "price>=entry*1.10 AND x_score rising AND >=2 tracked wallets hold", "order": [1.0, 0.5]}, {"id": "D_confirm_small_first", "trigger": "confirm", "order": [0.5, 1.0]}, {"id": "E_no_reentry", "trigger": "none", "order": []}], "paper_min_trades_per_variant": 100}},C=D.cfg;let tab='scan',W=JSON.parse(localStorage.w||'[]'),F={s:0,c:0,v:0,w:0};
const $=id=>document.getElementById(id);
document.getElementById('mq').textContent=D.tokens.map(t=>`🔥 $${t.sym} · ${t.mentions_15m} menzioni X/15m · score ${t.score}`).join('   •   ');
$('upd').textContent='Ultimo aggiornamento: '+new Date(D.tokens[0].at).toLocaleString('it-IT',{timeZone:'Europe/Rome'})+' (Roma)';
function badge(t){return t.veto.length?'<span class="pill sh">SHILL</span>':t.ok===false?'<span class="pill rug">RUG</span>':'<span class="pill ok">OK</span>'}
function card(t){return `<div class=card><div class=row><span class=sym>$${t.sym}</span>${badge(t)}<span class=sc>${t.score}</span><button class="st ${W.includes(t.mint)?'on':''}" onclick="star('${t.mint}')">★</button></div>
<div class=met><div><b>${t.unique_authors}</b>autori</div><div><b>${t.credible_authors}</b>credibili</div><div><b>${t.mentions_15m}/${t.mentions_prev_15m}</b>15m/prec</div><div><b>${t.dup_ratio}</b>dup</div></div>
<div class=row style="margin-top:8px"><span style="font-size:11px;color:#777;flex:1">liq $${Math.round(t.liq||0).toLocaleString()} · 1h ${t.h1}%</span><a href="https://dexscreener.com/solana/${t.mint}" target=_blank>DexScreener ↗</a></div></div>`}
function star(m){W=W.includes(m)?W.filter(x=>x!=m):[...W,m];localStorage.w=JSON.stringify(W);toast(W.includes(m)?'Aggiunto alla watchlist ★':'Rimosso dalla watchlist');render()}
function toast(s){$('t').textContent=s;$('t').style.opacity=1;setTimeout(()=>$('t').style.opacity=0,1500)}
function render(){const v=$('v'),L=[...D.tokens].sort((a,b)=>b.score-a.score);
if(tab=='scan')v.innerHTML='<h2>Scanner · token passati RugCheck</h2>'+L.map(card).join('');
if(tab=='watch')v.innerHTML='<h2>Watchlist</h2>'+(L.filter(t=>W.includes(t.mint)).map(card).join('')||'<div class=card>Nessun token. Tocca ★ per aggiungere.</div>');
if(tab=='hunt'){const r=L.filter(t=>t.score>=F.s&&t.credible_authors>=F.c&&t.mentions_15m>=F.v);v.innerHTML=`<h2>Caccia · filtri</h2><div class=card>
<label>Score X min: ${F.s}</label><input type=range max=100 value=${F.s} oninput="F.s=+this.value;render()">
<label>Autori credibili min: ${F.c}</label><input type=range max=25 value=${F.c} oninput="F.c=+this.value;render()">
<label>Velocità menzioni 15m min: ${F.v}</label><input type=range max=25 value=${F.v} oninput="F.v=+this.value;render()">
<label>Wallet tracciati min: ${F.w} (dato wallet non ancora collegato)</label><input type=range max=8 value=${F.w} oninput="F.w=+this.value;render()"></div>`+r.map(card).join('')}
if(tab=='trade')v.innerHTML=`<h2>Trade</h2><div class=card><div class=row><span class=sym>Modalità</span><span class="pill ${C.live_mode?'rug':'ok'}">${C.live_mode?'LIVE':'PAPER'}</span></div><p style="font-size:12px;color:#888">live_mode OFF · attivabile solo a mano in config</p>
<div class=met><div><b>${C.sizing.entry_usd}$</b>entry</div><div><b>${C.sizing.reentries_usd[0]}$</b>re-entry 1</div><div><b>${C.sizing.reentries_usd[1]}$</b>re-entry 2</div><div><b>${C.sizing.max_reentries}</b>max</div></div></div>`+C.paper_variants.map(p=>`<div class=card><div class=row><span class=sym>${p.id}</span><span class="pill g">${p.trigger}${p.dip_pct?' '+p.dip_pct+'%':''}</span></div><p style="font-size:12px;color:#888;margin:6px 0 0">Ordine: ${p.order.join(' → ')||'nessuna re-entry'} USD · 0/${C.paper_min_trades_per_variant} trade</p></div>`).join('');
if(tab=='dash'){const n=L.length,p=L.filter(t=>t.x_pass).length;v.innerHTML=`<h2>Dashboard</h2><div class=card><div class=met><div><b>${n}</b>token</div><div><b>${p}</b>X pass</div><div><b>${(L.reduce((a,t)=>a+t.score,0)/n).toFixed(1)}</b>score medio</div><div><b>${n}</b>call X</div></div></div><div class=card style="font-size:12px;color:#888">Budget X: ${C.x_budget.max_results_per_call}/call · ${C.x_budget.calls_per_min}/min · ${C.x_budget.calls_per_day}/giorno</div>`}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('a',x==b));render()});render();
</script></body></html>
